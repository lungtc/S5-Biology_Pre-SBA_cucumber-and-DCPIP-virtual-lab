<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SBA：青瓜抗壞血酸氧化酶與維生素 C ｜ 引導式虛擬實驗</title>
<style>
/* ==========================================================
設計 tokens（老師可改顏色）
DCPIP 藍 = 主色；青瓜綠 = 次色；番茄紅 = 錯誤提示
========================================================== */
:root{
--bg:#EDF1EE; --surface:#FFFFFF; --surface2:#F5F8F6; --ink:#17212B; --muted:#4D5B66;
--line:#CBD5CF; --dcpip:#2B56B5; --dcpip-soft:#E3EAF8; --cuke:#3F7A2E; --cuke-soft:#E4F0DF;
--tomato:#B3332A; --tomato-soft:#FBE7E4; --amber:#8A5B00; --amber-soft:#FFF3D6;
--focus:#F2B705; --radius-l:14px; --radius-s:8px;
color-scheme: light;
}
@media (prefers-color-scheme: dark){
:root:not([data-theme="light"]){
--bg:#121A1F; --surface:#1B252C; --surface2:#222E36; --ink:#E8EEF2; --muted:#A9B7C1;
--line:#34444F; --dcpip:#7FA3F0; --dcpip-soft:#22314F; --cuke:#8FCB7A; --cuke-soft:#22361E;
--tomato:#F08A80; --tomato-soft:#43231F; --amber:#F2C66B; --amber-soft:#3B2F14;
color-scheme: dark;
}
}
*{box-sizing:border-box}
html{font-size:17px; scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0; background:var(--bg); color:var(--ink);
font-family:"PingFang HK","PingFang TC","Microsoft JhengHei","Noto Sans TC","Noto Sans CJK TC","Heiti TC",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
line-height:1.65; padding-bottom:env(safe-area-inset-bottom,0px)}
h1,h2,h3{font-family:"Songti TC","Noto Serif TC","Noto Serif CJK TC","PMingLiU",Georgia,serif; line-height:1.3; margin:0 0 .5em}
html[lang="en"] body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,"PingFang HK","Microsoft JhengHei","Noto Sans TC",sans-serif}
html[lang="en"] h1,html[lang="en"] h2,html[lang="en"] h3{font-family:Georgia,"Times New Roman","Noto Serif TC",serif}
h1{font-size:1.45rem} h2{font-size:1.35rem} h3{font-size:1.1rem}
p{margin:.4em 0 .8em}
button,select,input,textarea{font:inherit; font-size:1rem; color:inherit}
:focus-visible{outline:3px solid var(--focus); outline-offset:2px}
.wrap{max-width:1100px; margin:0 auto; padding:0 16px}

/* ---------- Header ---------- */
header{position:sticky; top:0; z-index:20; background:var(--surface); border-bottom:1px solid var(--line); padding-top:env(safe-area-inset-top,0px)}
.topbar{display:flex; flex-wrap:wrap; align-items:center; gap:10px 16px; padding:10px 0}
.topbar h1{flex:1 1 300px; margin:0; font-size:1.15rem}
.topbar .sub{display:block; font-family:inherit; font-size:.85rem; color:var(--muted); font-weight:400}
.toggles{display:flex; gap:8px; flex-wrap:wrap}
.pill{border:1.5px solid var(--line); background:var(--surface2); border-radius:999px; padding:6px 14px; cursor:pointer; min-height:40px}
.pill[aria-pressed="true"]{background:var(--dcpip); color:#fff; border-color:var(--dcpip)}

/* 進度條：四支試管，完成度愈高，藍色 DCPIP 愈褪 */
.progress{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; padding:0 0 10px}
.stage-btn{display:flex; align-items:center; gap:10px; text-align:left; border:1.5px solid var(--line); background:var(--surface2);
border-radius:var(--radius-s); padding:6px 10px; cursor:pointer; min-height:48px}
.stage-btn[aria-current="step"]{border-color:var(--dcpip); background:var(--dcpip-soft)}
.stage-btn .lbl{font-size:.85rem; line-height:1.25}
.stage-btn .lbl b{display:block; font-size:.95rem}
.mini-tube{flex:0 0 auto}
@media (max-width:640px){ .stage-btn .lbl span, .stage-btn .nm{display:none} .stage-btn{justify-content:center; gap:6px} header{position:static} .topbar h1{font-size:1.05rem} }

main{padding:18px 0 60px}
.panel{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-l); padding:18px 20px; margin:0 0 16px}
.scenario{border-left:6px solid var(--cuke)}
.q{border-top:1px solid var(--line); padding-top:14px; margin-top:14px}
.q:first-of-type{border-top:0; margin-top:0; padding-top:0}
.qtext{font-weight:600; margin-bottom:8px}
.opts{display:grid; gap:8px}
.opt{display:block; width:100%; text-align:left; border:1.5px solid var(--line); background:var(--surface2); border-radius:var(--radius-s);
padding:10px 14px; cursor:pointer; min-height:44px}
.opt:hover{border-color:var(--dcpip)}
.opt.sel-ok{border-color:var(--cuke); background:var(--cuke-soft)}
.opt.sel-bad{border-color:var(--tomato); background:var(--tomato-soft)}
.opt.chk{border-color:var(--dcpip); background:var(--dcpip-soft)}
.fb{margin-top:8px; padding:10px 14px; border-radius:var(--radius-s); font-size:.97rem}
.fb.ok{background:var(--cuke-soft); border-left:5px solid var(--cuke)}
.fb.hint{background:var(--amber-soft); border-left:5px solid var(--amber)}
.fb.bad{background:var(--tomato-soft); border-left:5px solid var(--tomato)}
.fb:empty{display:none}
.btn{border:0; background:var(--dcpip); color:#fff; border-radius:var(--radius-s); padding:9px 16px; cursor:pointer; min-height:44px; font-weight:600}
.btn.sec{background:var(--surface2); color:var(--ink); border:1.5px solid var(--line)}
.btn.green{background:var(--cuke)}
.btn.warn{background:var(--tomato)}
.btn:disabled{opacity:.45; cursor:not-allowed}
.row{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.muted{color:var(--muted)}
.small{font-size:.9rem}
.nav-bottom{display:flex; justify-content:space-between; gap:10px; margin-top:8px}
.teacher-only{display:none}
body.teacher .teacher-only{display:block}
body.teacher .opt[data-ok="1"]::after{content:" ✓"; color:var(--cuke); font-weight:700}
.tag{display:inline-block; padding:1px 8px; border-radius:6px; font-size:.85rem; background:var(--dcpip-soft); color:var(--dcpip); font-weight:600}

/* 拖放分類 */
.bins{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
@media (max-width:760px){ .bins{grid-template-columns:1fr} }
.bin{border:2px dashed var(--line); border-radius:var(--radius-s); padding:10px; min-height:120px; background:var(--surface2)}
.bin.over{border-color:var(--dcpip); background:var(--dcpip-soft)}
.bin h4{margin:0 0 8px; font-size:.95rem}
.chip{display:inline-block; margin:4px; padding:7px 12px; border-radius:999px; border:1.5px solid var(--line); background:var(--surface);
cursor:grab; min-height:40px; text-align:left}
.chip.bad{border-color:var(--tomato)} .chip.good{border-color:var(--cuke)}

/* 表格 */
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse; width:100%; min-width:520px}
th,td{border:1px solid var(--line); padding:7px 9px; text-align:center; vertical-align:middle}
th{background:var(--surface2); font-weight:600}
td.l, th.l{text-align:left}
select{border:1.5px solid var(--line); border-radius:6px; padding:6px 8px; background:var(--surface); min-height:40px; max-width:100%}
input[type=number],input[type=text],textarea{border:1.5px solid var(--line); border-radius:6px; padding:7px 9px; background:var(--surface); width:100%}
input[type=number]{max-width:140px}
textarea{min-height:90px; resize:vertical}
input[type=range]{width:100%; accent-color:var(--dcpip); min-height:30px}

/* 實驗室 */
.lab{display:grid; grid-template-columns:minmax(260px,330px) 1fr; gap:16px}
@media (max-width:820px){ .lab{grid-template-columns:1fr} }
.ctrl{margin-bottom:12px}
.ctrl label{display:block; font-weight:600; margin-bottom:2px}
.ctrl .val{float:right; font-weight:700; color:var(--dcpip)}
.bench{background:var(--surface2); border-radius:var(--radius-s); border:1px solid var(--line)}
.bench svg{display:block; width:100%; height:auto; max-height:430px}
.readout{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:10px 0}
.readout div{background:var(--surface2); border:1px solid var(--line); border-radius:var(--radius-s); padding:6px 10px}
.readout b{display:block; font-size:1.35rem; color:var(--dcpip); font-variant-numeric:tabular-nums}
.readout span{font-size:.85rem; color:var(--muted)}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:16px}
@media (max-width:760px){ .grid2{grid-template-columns:1fr} }
.chart svg{width:100%; height:auto}
.report{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-s); padding:16px}
.report h3{margin-top:1em}
@media (prefers-reduced-motion: reduce){ *{transition:none!important; animation:none!important} }

/* 列印：只印報告 */
@media print{
header, .no-print, .nav-bottom{display:none!important}
body{background:#fff; color:#000}
body.print-report main > *:not(#report-panel){display:none!important}
.panel{border:0; padding:0}
}
</style>

<body>
<header>
<div class="wrap">
<div class="topbar">
<h1 id="title"></h1>
<div class="toggles">
<button class="pill" id="langBtn" onclick="toggleLang()" aria-label="中／英 切換 Chinese / English"></button>
<button class="pill" id="teacherBtn" onclick="toggleTeacher()" aria-pressed="false"></button>
</div>
</div>
<nav class="progress" id="progress" aria-label="Progress"></nav>
</div>
</header>
<main class="wrap" id="app" tabindex="-1"></main>

<script>
/* ==========================================================================
① 可調設定 CONFIG —— 老師主要改呢度
--------------------------------------------------------------------------
模擬模型（教學用簡化模型，並非真實動力學）：
1. 剩餘維生素 C = 初始濃度 × exp(−k_eff × 時間)
k_eff = K_ENZ × 酶活性(溫度) × 酶量因子 + 非酶氧化速率(溫度)
2. 酶活性：以 37 °C 為最適溫度的鐘形曲線；45 °C 以上開始變性，
60 °C 或以上活性 = 0。煮過的青瓜汁 / 蒸餾水：酶活性 = 0。
3. 滴定：所需體積 ∝ 1 / 滴定液中維生素 C 濃度。
校準：DCPIP 與抗壞血酸以 1:1 摩爾比反應。
1 cm³ 0.01% DCPIP = 0.1 mg ≈ 0.345 µmol（DCPIP 鈉鹽 M ≈ 290 g/mol）
需抗壞血酸 ≈ 0.345 µmol × 176 g/mol ≈ 0.061 mg ≈ 0.6 cm³ 0.01% 維生素 C
→ 1 cm³ 0.01% DCPIP 約需 0.6 cm³（≈12 滴）0.01% 維生素 C。
4. 新鮮青瓜汁本身含少量維生素 C／還原性物質（試管 A 會褪色）；
煮沸會破壞部分維生素 C（試管 B 通常 40 滴內不褪色）。
5. 每次滴定加入細小隨機誤差（約 ±1 滴），令重複數據有自然差異。
========================================================================== */
const CONFIG = {
DROP_UL: 50, // 每滴體積 (µL)
MAX_DROPS: 40, // 滴數上限（40 滴 = 2000 µL），超過即可停止
DCPIP_CONC: 0.01, // DCPIP 濃度 (%)
VITC_DEFAULT: 0.01, // 維生素 C 溶液預設濃度 (%)
VITC_OPTIONS: [0.01, 0.001],
VITC_VOL: 1.0, // 培育管中維生素 C 溶液體積 (cm³)，受控變數
VITC_CM3_PER_CM3_DCPIP: 0.6, // 校準常數：1 cm³ 0.01% DCPIP 需幾多 cm³ 0.01% 維生素 C
JUICE_VITC: { fresh: 0.0045, boiled: 0.0015, water: 0 }, // 液體本身「等效維生素 C」濃度 (%)
K_ENZ: 0.15, // 酶催化速率常數 (每分鐘，於最適溫度、標準酶量)
K_NONENZ_25: 0.002, // 25 °C 時維生素 C 自然氧化速率 (每分鐘)；每升 10 °C 加倍
T_OPT: 37, // 最適溫度 (°C)
T_SIGMA: 14, // 鐘形曲線闊度
T_DENAT_START: 45, // 開始變性溫度 (°C)
T_DENAT_END: 60, // 完全變性溫度 (°C)
NOISE_SD: 0.6, // 隨機誤差標準差（滴）；限制喺 ±1.5 滴內
ROOM_T: 25, // 室溫 (°C)
STD_TIME: 10, // 標準培育時間 (分鐘)
STD_JUICE_VOL: 1.0, // 標準青瓜汁體積 (cm³)
STD_DCPIP_VOL: 1.0, // 標準 DCPIP 體積 (cm³)
CALIB_DROPS: 40, // 校準活動滴數
CALIB_TRUE_RANGE: [46, 54], // 校準時滴管「真實」每滴體積範圍 (µL)
  SUBMIT_URL: 'https://script.google.com/a/macros/semple.edu.hk/s/AKfycbwAA3JqnVknaPIdoHyKb12aUJmoYk0nVtaz6-Joo1xKPWDAiYPlmnS3S8ymNaD6gOZw/exec'            // 老師：貼上 Google Apps Script 網頁應用程式網址（/exec 結尾），學生便可一鍵提交報告
};

/* ==========================================================================
② 狀態（只用 JS 變數，不用 localStorage）
========================================================================== */
const S = {
lang: 'zh', stage: 1, teacher: false,
s1: { ans: {}, bins: {}, cvChecked: false, cvOk: false },
s2: { app: {}, appChecked: null, group: {}, groupChecked: null, pred: {},
calib: { trials: [], drops: 0, trueUL: null, reading: '', perDrop: '', msg: null } },
lab: { tube: 'C', juice: 'fresh', vitC: CONFIG.VITC_DEFAULT, juiceVol: CONFIG.STD_JUICE_VOL,
time: CONFIG.STD_TIME, temp: CONFIG.ROOM_T, dcpipVol: CONFIG.STD_DCPIP_VOL, reps: 3,
phase: 'setup', trial: null, drops: 0, incElapsed: 0, speed: 30, incRunning: false,
fast: false, msg: null, kOverride: null },
results: {}, // key → {key, short, label, params, trials:[{v, over}]}
resultOrder: [],
s4: { ans: {}, multi: {}, text: { concl: '', e1e2: '', limits: '', improve: '' } },
student: { name: '', cls: '' }
};

/* 計時器 handle */
let incTimer = null, fastTimer = null, dropAnimating = false;

/* ==========================================================================
③ 小工具
========================================================================== */
const $ = id => document.getElementById(id);
const L = (zh, en) => S.lang === 'zh' ? zh : en;
const tx = o => (o && typeof o === 'object') ? (S.lang === 'zh' ? o.zh : o.en) : (o || '');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = (n, d = 1) => Number(n).toFixed(d);
function randNoise(){ // 近似常態分佈，限制 ±1.5 滴
let r = 0; for (let i = 0; i < 4; i++) r += Math.random(); r = (r - 2) / 0.577; // sd≈1
return Math.max(-1.5, Math.min(1.5, r * CONFIG.NOISE_SD));
}
function mixColor(a, b, t){ // a→b, t∈[0,1]
return `rgb(${a.map((v, i) => Math.round(v + (b[i] - v) * t)).join(',')})`;
}

/* ==========================================================================
④ 模擬模型
========================================================================== */
/** 酶活性 (0–1)，只有新鮮青瓜汁有活性 */
function enzymeActivity(T, juice){
if (juice !== 'fresh') return 0; // 煮過 = 已變性；蒸餾水 = 無酶
if (T >= CONFIG.T_DENAT_END) return 0; // 高溫完全變性
let a = Math.exp(-Math.pow((T - CONFIG.T_OPT) / CONFIG.T_SIGMA, 2));
if (T > CONFIG.T_DENAT_START) // 45–60 °C 線性下降至 0
a *= (CONFIG.T_DENAT_END - T) / (CONFIG.T_DENAT_END - CONFIG.T_DENAT_START);
return a;
}
/** 非酶自然氧化速率（每升 10 °C 加倍） */
const kNonEnz = T => CONFIG.K_NONENZ_25 * Math.pow(2, (T - 25) / 10);
const kEnz = () => S.lab.kOverride ?? CONFIG.K_ENZ;

/** 計算一次實驗的滴定液維生素 C 濃度（%） */
function computeTrial(p){
const r = { initial: 0, remaining: 0, activity: 0, kEff: 0, isE: p.tube === 'E' };
if (p.tube === 'A') r.initial = CONFIG.JUICE_VITC.fresh;
else if (p.tube === 'B') r.initial = CONFIG.JUICE_VITC.boiled;
else if (p.tube === 'C') r.initial = p.vitC;
else if (p.tube === 'D') r.initial = 0;
else {
// 培育管：1 cm³ 維生素 C + V cm³ 液體，兩者混合後被稀釋
const V = p.juiceVol, Vc = CONFIG.VITC_VOL;
r.initial = (Vc * p.vitC + V * CONFIG.JUICE_VITC[p.juice]) / (Vc + V);
// 酶量因子：混合物中青瓜汁比例 ÷ 標準比例 (1:1 = 0.5)
const enzFactor = (V / (Vc + V)) / 0.5;
r.activity = enzymeActivity(p.temp, p.juice);
r.kEff = kEnz() * r.activity * enzFactor + kNonEnz(p.temp);
}
r.remaining = r.isE ? r.initial * Math.exp(-r.kEff * p.time) : r.initial;
r.theory = theoreticalDrops(p.dcpipVol, r.remaining);
return r;
}
/** 理論所需滴數：所需體積 ∝ DCPIP 量 / 維生素 C 濃度 */
function theoreticalDrops(dcpipVol, conc){
if (conc <= 0) return Infinity;
const vol_cm3 = dcpipVol * (CONFIG.DCPIP_CONC / 0.01) * CONFIG.VITC_CM3_PER_CM3_DCPIP * (0.01 / conc);
return vol_cm3 * 1000 / CONFIG.DROP_UL;
}

/* ==========================================================================
⑤ 題目資料（中英）
ok:true = 正確答案；fb = 回饋（答錯時只係 hint，不直接給答案）
========================================================================== */
const Q1 = [
{ id:'hyp', q:{zh:'根據情境，以下哪一個是最合適、可以用實驗驗證的假設 (hypothesis)？', en:'Based on the scenario, which is the most suitable testable hypothesis?'},
opts:[
{ok:true, t:{zh:'新鮮青瓜汁中的抗壞血酸氧化酶 (ascorbate oxidase) 會催化維生素 C 氧化，令維生素 C 含量下降。', en:'Ascorbate oxidase in fresh cucumber juice catalyses the oxidation of vitamin C, lowering the vitamin C content.'},
fb:{zh:'正確！呢個假設指出咗原因（酶）同一個可以量度嘅結果（維生素 C 含量），可以用 DCPIP 測試驗證。', en:'Correct! It names a cause (the enzyme) and a measurable outcome (vitamin C content) that DCPIP can test.'}},
{t:{zh:'同時吃青瓜和番茄對健康有害。', en:'Eating cucumber and tomato together is harmful to health.'},
fb:{zh:'提示：「對健康有害」可以點樣喺實驗室量度？假設應該包含一個可以量度嘅變數。', en:'Hint: how would you measure “harmful to health” in a lab? A hypothesis should involve a measurable variable.'}},
{t:{zh:'青瓜含有維生素 C，所以可以補充番茄的維生素 C。', en:'Cucumber contains vitamin C, so it adds to the vitamin C of tomato.'},
fb:{zh:'提示：龍 sir 想驗證嘅係咩說法？假設要回應情境入面嘅問題。', en:'Hint: which claim does Mr Lung want to test? The hypothesis should answer that question.'}},
{t:{zh:'煮過的青瓜汁會令維生素 C 含量上升。', en:'Boiled cucumber juice increases vitamin C content.'},
fb:{zh:'提示：情境提到嘅酶喺新鮮定煮過嘅青瓜汁入面先有活性？', en:'Hint: is the enzyme mentioned active in fresh or in boiled juice?'}}]},
{ id:'iv', q:{zh:'在培育實驗（E1–E3）中，自變量 (independent variable) 是甚麼？', en:'In the incubation set-up (E1–E3), what is the independent variable?'},
opts:[
{ok:true, t:{zh:'加入維生素 C 溶液的液體種類：新鮮青瓜汁／煮過的青瓜汁／蒸餾水（即有否活性抗壞血酸氧化酶）', en:'The liquid added to the vitamin C solution: fresh juice / boiled juice / distilled water (i.e. presence of active ascorbate oxidase)'},
fb:{zh:'正確！自變量係你刻意改變嘅因素。', en:'Correct! The independent variable is the factor you deliberately change.'}},
{t:{zh:'令 DCPIP 褪色所需的體積', en:'Volume needed to decolourise DCPIP'},
fb:{zh:'提示：呢個係你量度出嚟嘅數值。自變量係你「刻意改變」嘅嘢。', en:'Hint: this is what you measure. The independent variable is what you deliberately change.'}},
{t:{zh:'培育時間', en:'Incubation time'},
fb:{zh:'提示：E1、E2、E3 嘅培育時間有冇唔同？三支管都一樣嘅話，佢係咩變數？', en:'Hint: do E1, E2 and E3 differ in incubation time? If all the same, what kind of variable is it?'}},
{t:{zh:'DCPIP 溶液的濃度', en:'Concentration of DCPIP'},
fb:{zh:'提示：三支 DCPIP 管用嘅 DCPIP 濃度係咪一樣？', en:'Hint: is the same DCPIP concentration used in all three tubes?'}}]},

function mcqHTML(q, store, prefix){
const a = store[q.id];
const opts = q.opts.map((o, i) => {
let cls = 'opt';
if (a !== undefined && a === i) cls += o.ok ? ' sel-ok' : ' sel-bad';
return `<button class="${cls}" data-ok="${o.ok?1:0}" id="${prefix}-${q.id}-${i}" onclick="answerMCQ('${prefix}','${q.id}',${i})">${esc(tx(o.t))}</button>`;
}).join('');
let fb = '';
if (a !== undefined){ const o = q.opts[a]; fb = `<div class="fb ${o.ok?'ok':'hint'}">${esc(tx(o.fb))}</div>`; }
return `<div class="q" id="q-${prefix}-${q.id}"><div class="qtext">${esc(tx(q.q))}</div>
<div class="opts" role="group" aria-label="${esc(tx(q.q))}">${opts}</div><div aria-live="polite">${fb}</div></div>`;
}
function answerMCQ(prefix, id, i){
const bank = prefix === 's1' ? Q1 : Q4; const store = prefix === 's1' ? S.s1.ans : S.s4.ans;
store[id] = i;
const q = bank.find(x => x.id === id);
$(`q-${prefix}-${id}`).outerHTML = mcqHTML(q, store, prefix);
$(`${prefix}-${id}-${i}`).focus();
renderProgress();
}
function multiHTML(q){
const st = S.s4.multi[q.id] || { sel: [], checked: false };
const opts = q.opts.map((o, i) => {
const on = st.sel.includes(i);
let cls = 'opt' + (on ? ' chk' : '');
if (st.checked && on) cls = 'opt ' + (o.ok ? 'sel-ok' : 'sel-bad');
return `<button class="${cls}" data-ok="${o.ok?1:0}" aria-pressed="${on}" id="m-${q.id}-${i}" onclick="toggleMulti('${q.id}',${i})">${on?'☑':'☐'} ${esc(tx(o.t))}</button>`;
}).join('');
let fb = '';
if (st.checked){
const wrong = st.sel.filter(i => !q.opts[i].ok).map(i => '• ' + tx(q.opts[i].fb));
const missing = q.opts.filter((o, i) => o.ok && !st.sel.includes(i)).length;
if (!wrong.length && !missing) fb = `<div class="fb ok">${L('全部正確！','All correct!')}</div>`;
else fb = `<div class="fb hint">${wrong.map(esc).join('<br>')}${missing?`${wrong.length?'<br>':''}${L(`仲有 ${missing} 個合理選項未揀。`,`${missing} sensible option(s) not yet chosen.`)}`:''}</div>`;
}
return `<div class="q" id="q-m-${q.id}"><div class="qtext">${esc(tx(q.q))}</div><div class="opts">${opts}</div>
<div class="row" style="margin-top:8px"><button class="btn sec" onclick="checkMulti('${q.id}')">${L('檢查答案','Check')}</button></div><div aria-live="polite">${fb}</div></div>`;
}
function toggleMulti(id, i){
const st = S.s4.multi[id] || (S.s4.multi[id] = { sel: [], checked: false });
st.sel = st.sel.includes(i) ? st.sel.filter(x => x !== i) : [...st.sel, i]; st.checked = false;
$(`q-m-${id}`).outerHTML = multiHTML(Q4M.find(q => q.id === id)); $(`m-${id}-${i}`).focus();

function checkMulti(id){
const st = S.s4.multi[id] || (S.s4.multi[id] = { sel: [], checked: false }); st.checked = true;

function stageCompletion(n){

return done / 7; }
if (n === 2){ let d = 0; if (S.s2.appChecked?.ok) d++; if (S.s2.groupChecked?.ok) d++;
if (TUBES.every(t => S.s2.pred[t])) d++; if (S.s2.calib.trials.length >= 2) d++; return d / 4; }
if (n === 3){ return TUBES.filter(t => { const r = S.results[stdKey(t)]; return r && r.trials.length >= 3; }).length / 7; }
const n4 = Object.keys(S.s4.ans).filter(id => { const q = Q4.find(x => x.id === id); return q.opts[S.s4.ans[id]].ok; }).length

}

}

/** 5 cm³ 量筒 + 放大刻度（0.1 cm³ 一格） */
function cylinderSVG(vol, showZoom){
const top = 30, bottom = 290, scale = (bottom - top) / 5; // px per cm³
const y = bottom - vol * scale;
let ticks = '';
for (let i = 0; i <= 50; i++){
const yy = bottom - i * 0.1 * scale, major = i % 10 === 0, mid = i % 5 === 0;
ticks += `<line x1="70" x2="${major?92:mid?86:80}" y1="${yy}" y2="${yy}" stroke="currentColor" stroke-width="${major?1.4:.8}"/>`;
if (major) ticks += `<text x="100" y="${yy+5}" font-size="13" fill="currentColor">${i/10}</text>`;
}
// 放大視窗：顯示讀數附近 ±0.3 cm³
let zoom = '';
if (showZoom){
const zs = 150; // px per cm³ in zoom
const cx = 200, cy = 160;
let zt = '';
const base = Math.round(vol * 10) / 10;
for (let k = -4; k <= 4; k++){
const v = base + k * 0.1; if (v < 0) continue;
const yy = cy - (v - vol) * zs;
const lab = Math.round(v*10) % 5 === 0;
zt += `<line x1="${cx}" x2="${cx + (lab?40:26)}" y1="${yy}" y2="${yy}" stroke="currentColor" stroke-width="${lab?1.6:1}"/>`;
if (lab) zt += `<text x="${cx+46}" y="${yy+5}" font-size="13" fill="currentColor">${fmt(v,1)}</text>`;
}
zoom = `<g><clipPath id="zc"><rect x="180" y="80" width="130" height="160" rx="10"/></clipPath>
<rect x="180" y="80" width="130" height="160" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="2"/>
<g clip-path="url(#zc)"><rect x="180" y="${cy}" width="130" height="200" fill="#bcd9f2" opacity=".7"/>
<path d="M180 ${cy-7} Q245 ${cy+8} 310 ${cy-7}" fill="none" stroke="#3d6f9c" stroke-width="2"/>${zt}</g>
<text x="245" y="72" text-anchor="middle" font-size="13" fill="currentColor">${L('放大刻度（每格 0.1 cm³）','Zoomed scale (0.1 cm³)')}</text></g>`;
}
return `<svg viewBox="0 0 330 310" role="img" aria-label="${L('5 cm³ 量筒，液體體積','5 cm³ cylinder, volume')} ${showZoom?'':fmt(vol,2)}" style="color:var(--ink)">
<rect x="40" y="${top-10}" width="30" height="${bottom-top+12}" rx="3" fill="none" stroke="currentColor" stroke-width="2"/>
${vol>0?`<rect x="42" y="${y}" width="26" height="${bottom-y+1}" fill="#bcd9f2"/><path d="M42 ${y-3} Q55 ${y+3} 68 ${y-3}" fill="none" stroke="#3d6f9c" stroke-width="1.5"/>`:''}
<rect x="28" y="${bottom+2}" width="54" height="8" rx="2" fill="currentColor" opacity=".6"/>
${ticks}${zoom}</svg>`;
}
function calibDrop(n){

function calibCheck(){
const c = S.s2.calib; const trueVol = c.drops * c.trueUL / 1000;
const r = parseFloat(c.reading), p = parseFloat(c.perDrop);
if (isNaN(r) || isNaN(p)){ c.msg = {ok:false, zh:'請先輸入讀數同每滴體積。', en:'Enter both the reading and the volume per drop.'}; }
else if (Math.abs(r - trueVol) > 0.06){ c.msg = {ok:false, zh:'讀數唔太啱。提示：眼睛同液面平視，讀凹液面最低點；用放大刻度數格（每格 0.1 cm³）。', en:'Reading is off. Hint: eye level with the liquid, read the bottom of the meniscus; count 0.1 cm³ marks in the zoom.'}; }
else if (Math.abs(p - r / c.drops * 1000) > 1){ c.msg = {ok:false, zh:`計算再檢查：每滴 = ${fmt(r,2)} ÷ ${c.drops} × 1000 µL。`, en:`Check the maths: per drop = ${fmt(r,2)} ÷ ${c.drops} × 1000 µL.`}; }
else {
c.trials.push({ drops: c.drops, reading: r, perDrop: p });
c.msg = {ok:true, zh:`已記錄第 ${c.trials.length} 次。${c.trials.length<3?'量筒已倒空，可以再做一次。':'三次完成！'}`, en:`Trial ${c.trials.length} recorded. ${c.trials.length<3?'Cylinder emptied; repeat.':'All three done!'}`};
c.drops = 0; c.reading = ''; c.perDrop = '';
c.trueUL = CONFIG.CALIB_TRUE_RANGE[0] + Math.random() * (CONFIG.CALIB_TRUE_RANGE[1] - CONFIG.CALIB_TRUE_RANGE[0]);

/* 實驗流程 */
function startTrial(){
const p = currentParams(), r = computeTrial(p);
const required = isFinite(r.theory) ? Math.max(0.6, r.theory + randNoise()) : Infinity;
const max = maxDropsFor(p);
const endpoint = required <= max ? Math.max(1, Math.round(required)) : null;
S.lab.trial = { p, r, required, endpoint, max };
S.lab.drops = 0; S.lab.incElapsed = 0; S.lab.incRunning = false; S.lab.msg = null;
S.lab.phase = p.tube === 'E' && p.time > 0 ? 'incubating' : 'titrating';
if (p.tube === 'E' && p.time === 0) S.lab.msg = {cls:'hint', zh:'培育時間 = 0：混合後立即滴定。', en:'Incubation time = 0: titrate immediately after mixing.'};
renderS3();
(S.lab.phase === 'incubating' ? $('incBtn') : $('dropBtn'))?.focus();
}
function toggleInc(){
const lb = S.lab; lb.incRunning = !lb.incRunning;
clearInterval(incTimer);
if (lb.incRunning){
incTimer = setInterval(() => {
lb.incElapsed += 0.1 * lb.speed;
if (lb.incElapsed >= lb.trial.p.time * 60){ finishInc(); return; }
if ($('bench')) updateBench();
}, 100);
}
renderLabActions(); $('incBtn')?.focus();
}
function finishInc(){
clearInterval(incTimer); const lb = S.lab;
lb.incRunning = false; lb.incElapsed = lb.trial.p.time * 60; lb.phase = 'titrating';
lb.msg = {cls:'hint', zh:'培育完成！立即把混合物逐滴加入 DCPIP 管。', en:'Incubation done! Add the mixture to the DCPIP tube immediately.'};
if ($('bench')){ updateBench(); renderLabActions(); renderLabMsg(); $('dropBtn')?.focus(); }
}
function addDrop(){
const lb = S.lab; if (lb.phase !== 'titrating' || dropAnimating) return;
dropAnimating = true;
animateDrop(() => {
dropAnimating = false;
lb.drops++;
const tr = lb.trial;
if (tr.endpoint !== null && lb.drops >= tr.endpoint){
stopFast(); recordTrial(lb.drops, false);
lb.msg = {cls:'ok', zh:`DCPIP 已褪色！共 ${lb.drops} 滴（${lb.drops*CONFIG.DROP_UL} µL），已記錄。`, en:`DCPIP decolourised after ${lb.drops} drops (${lb.drops*CONFIG.DROP_UL} µL). Recorded.`};
lb.phase = 'done';
} else if (lb.drops >= tr.max){
stopFast(); lb.phase = 'limit';
lb.msg = {cls:'bad', zh: tr.max < CONFIG.MAX_DROPS ? `混合物已用完（${tr.max} 滴），DCPIP 仍未褪色，可以停止。` : `已加 ${tr.max} 滴（${tr.max*CONFIG.DROP_UL} µL）仍未褪色，可以停止。`,
en: tr.max < CONFIG.MAX_DROPS ? `Mixture used up (${tr.max} drops) and DCPIP is still blue. You may stop.` : `${tr.max} drops (${tr.max*CONFIG.DROP_UL} µL) added and still blue. You may stop.`};
}
if ($('bench')){ updateBench(); renderReadout(); renderLabMsg(); renderTeacherBox();
if (lb.phase !== 'titrating'){ renderLabActions(); renderResTable(); ($('startBtn')||$('stopBtn'))?.focus(); } }
});
}
function toggleFast(){
const lb = S.lab;
if (lb.fast){ stopFast(); }
else { lb.fast = true; fastTimer = setInterval(() => { if (S.lab.phase !== 'titrating'){ stopFast(); return; } addDrop(); }, 170); }
renderLabActions(); $('fastBtn')?.focus();
}
function stopFast(){ clearInterval(fastTimer); S.lab.fast = false; }
function stopAtLimit(){
const lb = S.lab; recordTrial(lb.trial.max, true); lb.phase = 'done';
lb.msg = {cls:'hint', zh:`已記錄為「> ${lb.trial.max} 滴」。`, en:`Recorded as “> ${lb.trial.max} drops”.`};
renderS3(); $('startBtn')?.focus();
}
function recordTrial(v, over){
const p = S.lab.trial.p, key = paramKey(p);
if (!S.results[key]){
S.results[key] = { key, short: tubeName(p) + (isStd(p) ? '' : '*'), p, trials: [] };
S.resultOrder.push(key);
}
S.results[key].trials.push({ v, over });
renderProgress();
}
function stats(row){
const vals = row.trials.map(t => t.v), anyOver = row.trials.some(t => t.over);
if (!vals.length) return null;
const mean = vals.reduce((a, b) => a + b, 0) / vals.length;
return { anyOver, mean, min: Math.min(...vals), max: Math.max(...vals) };
}
function renderResTable(){
const el = $('resTable'); if (!el) return;
if (!S.resultOrder.length){ el.innerHTML = `<p class="muted">${L('未有數據。開始第一個實驗後，結果會自動記錄喺度。','No data yet. Results appear here once you finish a trial.')}</p>`; return; }
const n = Math.max(3, ...S.resultOrder.map(k => S.results[k].trials.length));
el.innerHTML = `<div class="tbl-wrap"><table><thead><tr><th>${L('試管','Tube')}</th><th class="l">${L('條件','Conditions')}</th>
${Array.from({length:n},(_,i)=>`<th>${L('第','Trial ')}${i+1}${L('次','')}</th>`).join('')}<th>${L('平均（滴）','Mean (drops)')}</th><th>${L('範圍','Range')}</th><th>${L('平均體積 (µL)','Mean vol (µL)')}</th><th class="no-print"></th></tr></thead>
<tbody>${S.resultOrder.map(k => { const r = S.results[k], s = stats(r);
return `<tr><th>${r.short}</th><td class="l small">${esc(paramDesc(r.p))}</td>
${Array.from({length:n},(_,i)=>{ const t = r.trials[i]; return `<td>${t ? (t.over ? '&gt;'+t.v : t.v) : ''}</td>`; }).join('')}
<td><b>${s.anyOver ? '&gt;'+fmt(s.max,0) : fmt(s.mean,1)}</b></td>
<td>${s.anyOver ? '—' : `${s.min}–${s.max}`}</td>
<td>${s.anyOver ? '&gt;'+(s.max*CONFIG.DROP_UL) : fmt(s.mean*CONFIG.DROP_UL,0)}</td>
<td class="no-print"><button class="btn sec small" onclick="delRow('${k}')" aria-label="${L('刪除','Delete')} ${r.short}">${L('刪除','Delete')}</button></td></tr>`; }).join('')}</tbody></table></div>
<p class="small muted">${L('* = 非標準條件（與 PDF 步驟不同）。「&gt;40」表示 40 滴仍未褪色，不能計算平均值。','* = non-standard conditions. “>40” means not decolourised by 40 drops; no mean can be calculated.')}</p>`;
}
function delRow(k){ delete S.results[k]; S.resultOrder = S.resultOrder.filter(x => x !== k); renderResTable(); renderReadout(); renderLabActions(); renderProgress(); }
/** 老師：自動完成標準 A–E3 各 3 次 */
function autoStandard(){
const save = { ...S.lab };
TUBES.forEach(t => {
const p = { tube: t.startsWith('E') ? 'E' : t, juice: {E1:'fresh',E2:'boiled',E3:'water'}[t] || 'fresh', vitC: CONFIG.VITC_DEFAULT,
juiceVol: CONFIG.STD_JUICE_VOL, time: CONFIG.STD_TIME, temp: CONFIG.ROOM_T, dcpipVol: CONFIG.STD_DCPIP_VOL };
const key = paramKey(p);
while ((S.results[key]?.trials.length || 0) < 3){
const r = computeTrial(p), req = isFinite(r.theory) ? Math.max(0.6, r.theory + randNoise()) : Infinity, max = maxDropsFor(p);
S.lab.trial = { p, r, required: req, endpoint: req <= max ? Math.max(1, Math.round(req)) : null, max };
if (S.lab.trial.endpoint !== null) recordTrial(S.lab.trial.endpoint, false); else recordTrial(max, true);
}
});
Object.assign(S.lab, { tube: save.tube, juice: save.juice, phase: 'setup', trial: null, drops: 0 });
renderS3();
}

function chartSVG(){
const rows = S.resultOrder.map(k => S.results[k]).filter(r => r.trials.length);
if (!rows.length) return '';
const W = 680, H = 360, m = { l: 58, r: 66, t: 20, b: 50 }, yMax = 45;
const pw = W - m.l - m.r, ph = H - m.t - m.b, n = rows.length, slot = pw / n, bw = Math.min(56, slot * 0.6);
const Y = v => m.t + ph - (v / yMax) * ph;
let g = '';
for (let v = 0; v <= 45; v += 5){
g += `<line x1="${m.l}" x2="${m.l+pw}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/>
<text x="${m.l-8}" y="${Y(v)+5}" text-anchor="end" font-size="13" fill="currentColor">${v}</text>
<text x="${m.l+pw+8}" y="${Y(v)+5}" font-size="13" fill="currentColor">${v*CONFIG.DROP_UL}</text>`;
}
g += `<line x1="${m.l}" x2="${m.l+pw}" y1="${Y(40)}" y2="${Y(40)}" stroke="var(--tomato)" stroke-dasharray="6 4" stroke-width="1.5"/>
<text x="${m.l+pw-4}" y="${Y(40)-6}" text-anchor="end" font-size="12" fill="var(--tomato)">${L('上限 40 滴','limit 40 drops')}</text>`;
const colorOf = r => ({A:'#6E9F55',B:'#9CB37A',C:'#2B56B5',D:'#8DA2B8',E1:'#3F7A2E',E2:'#B08B3A',E3:'#5E7FC4'})[tubeName(r.p)] || '#777';
rows.forEach((r, i) => {
const s = stats(r), x = m.l + slot * i + (slot - bw) / 2, v = s.anyOver ? 40 : s.mean;
g += `<rect x="${x}" y="${Y(v)}" width="${bw}" height="${Y(0)-Y(v)}" fill="${colorOf(r)}" ${s.anyOver?'fill-opacity=".35"':''}/>`;
if (s.anyOver) g += `<rect x="${x}" y="${Y(v)}" width="${bw}" height="${Y(0)-Y(v)}" fill="url(#hatch)"/><text x="${x+bw/2}" y="${Y(v)-6}" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor">&gt;40</text>`;
else if (r.trials.length > 1){
const cx = x + bw / 2;
g += `<line x1="${cx}" x2="${cx}" y1="${Y(s.max)}" y2="${Y(s.min)}" stroke="currentColor" stroke-width="1.6"/>
<line x1="${cx-7}" x2="${cx+7}" y1="${Y(s.max)}" y2="${Y(s.max)}" stroke="currentColor" stroke-width="1.6"/>
<line x1="${cx-7}" x2="${cx+7}" y1="${Y(s.min)}" y2="${Y(s.min)}" stroke="currentColor" stroke-width="1.6"/>
<text x="${cx}" y="${Y(s.max)-6}" text-anchor="middle" font-size="12" fill="currentColor">${fmt(s.mean,1)}</text>`;
} else g += `<text x="${x+bw/2}" y="${Y(v)-6}" text-anchor="middle" font-size="12" fill="currentColor">${fmt(s.mean,1)}</text>`;
g += `<text x="${x+bw/2}" y="${Y(0)+20}" text-anchor="middle" font-size="14" font-weight="700" fill="currentColor">${r.short}</text>`;
});
return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${L('長條圖：各試管令 DCPIP 褪色的平均滴數','Bar chart: mean drops to decolourise DCPIP')}" style="color:var(--ink)">
<defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="currentColor" stroke-width="2" opacity=".5"/></pattern></defs>
${g}<line x1="${m.l}" x2="${m.l}" y1="${m.t}" y2="${Y(0)}" stroke="currentColor"/><line x1="${m.l}" x2="${m.l+pw}" y1="${Y(0)}" y2="${Y(0)}" stroke="currentColor"/>
<text transform="translate(16 ${m.t+ph/2}) rotate(-90)" text-anchor="middle" font-size="13" fill="currentColor">${L('平均滴數','Mean drops')}</text>
<text transform="translate(${W-12} ${m.t+ph/2}) rotate(90)" text-anchor="middle" font-size="13" fill="currentColor">${L('平均體積 (µL)','Mean volume (µL)')}</text>
<text x="${m.l+pw/2}" y="${H-6}" text-anchor="middle" font-size="13" fill="currentColor">${L('試管（誤差線 = 三次重複的範圍）','Tube (error bars = range of repeats)')}</text></svg>`;
}
function predCompareHTML(){

<p>${d.cal.length ? d.cal.map((t,i)=>`${L('第','Trial ')}${i+1}${L('次','')}: ${fmt(t.reading,2)} cm³ / ${t.drops} = ${fmt(t.perDrop,1)} µL`).join('<br>') + `<br><b>${L('平均','Mean')}：${fmt(d.calAvg,1)} µL</b>` : none}</p>
<h3>${L('結果','Results')}</h3>
${d.rows.length ? `<div class="tbl-wrap"><table><thead><tr><th>${L('試管','Tube')}</th><th class="l">${L('條件','Conditions')}</th><th>${L('各次滴數','Drops per trial')}</th><th>${L('平均','Mean')}</th><th>${L('範圍','Range')}</th><th>µL</th></tr></thead>
<tbody>${d.rows.map(r=>`<tr><th>${r.tube}</th><td class="l small">${esc(r.cond)}</td><td>${esc(r.trials.join(', '))}</td><td>${esc(r.mean)}</td><td>${r.range}</td><td>${esc(r.vol)}</td></tr>`).join('')}</tbody></table></div>
<div class="chart" style="margin-top:10px">${chartSVG()}</div>` : none}
<h3>${L('結論','Conclusion')}</h3><p>${T.concl.trim() ? esc(T.concl).replace(/\n/g,'<br>') : none}</p>
<h3>${L('E1 與 E2 的差異','E1 vs E2')}</h3><p>${T.e1e2.trim() ? esc(T.e1e2).replace(/\n/g,'<br>') : none}</p>
<h3>${L('局限','Limitations')}</h3><p>${T.limits.trim() ? esc(T.limits).replace(/\n/g,'<br>') : none}</p>
<h3>${L('改良','Improvements')}</h3><p>${T.improve.trim() ? esc(T.improve).replace(/\n/g,'<br>') : none}</p></div>`;
}
function reportText(){
const d = reportData(), T = S.s4.text, nl = '\n';
let s = `${L('探究青瓜中的抗壞血酸氧化酶對維生素 C 的影響','Effect of cucumber ascorbate oxidase on vitamin C')}${nl}`;
s += `${L('姓名','Name')}: ${S.student.name} ${L('班別','Class')}: ${S.student.cls}${nl}${nl}`;
s += `【${L('假設','Hypothesis')}】${nl}${d.pick('hyp')}${nl}${nl}`;
s += `【${L('變數','Variables')}】${nl}${L('自變量','IV')}: ${d.pick('iv')}${nl}${L('應變量','DV')}: ${d.pick('dv')}${nl}${L('受控變數','CVs')}: ${d.cvs.join('; ')}${nl}${nl}`;
s += `【${L('每滴體積校準','Drop calibration')}】${nl}${d.cal.map((t,i)=>`${i+1}: ${fmt(t.reading,2)} cm3 / ${t.drops} = ${fmt(t.perDrop,1)} µL`).join(nl)}${d.cal.length?`${nl}${L('平均','Mean')}: ${fmt(d.calAvg,1)} µL`:''}${nl}${nl}`;
s += `【${L('結果','Results')}】${nl}${L('試管','Tube')}\t${L('條件','Conditions')}\t${L('各次滴數','Trials')}\t${L('平均','Mean')}\t${L('範圍','Range')}\tµL${nl}`;
d.rows.forEach(r => s += `${r.tube}\t${r.cond}\t${r.trials.join(', ')}\t${r.mean}\t${r.range}\t${r.vol}${nl}`);
s += `${nl}【${L('結論','Conclusion')}】${nl}${T.concl}${nl}${nl}【${L('E1 與 E2 的差異','E1 vs E2')}】${nl}${T.e1e2}${nl}${nl}【${L('局限','Limitations')}】${nl}${T.limits}${nl}${nl}【${L('改良','Improvements')}】${nl}${T.improve}${nl}`;
return s;
}
function copyReport(){
const text = reportText(), msg = $('copyMsg');
const ok = () => msg.textContent = L('已複製！','Copied!');
const fallback = () => { const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select();
try { document.execCommand('copy'); ok(); } catch(e){ msg.textContent = L('複製失敗，請手動選取報告文字。','Copy failed; select the report text manually.'); } t.remove(); };
if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(ok, fallback); else fallback();
}
/** 提交報告到老師的 Google Sheet（經 Google Apps Script） */
async function submitReport(){
  const msg = $('copyMsg');
  if (!CONFIG.SUBMIT_URL){ msg.textContent = L('老師尚未設定提交網址 (CONFIG.SUBMIT_URL)。','Teacher has not set CONFIG.SUBMIT_URL yet.'); return; }
  if (!S.student.name.trim() || !S.student.cls.trim()){ msg.textContent = L('請先填寫姓名和班別。','Please enter your name and class first.'); return; }
  const d = reportData(), T = S.s4.text, means = {};
  TUBES.forEach(t => { const r = S.results[stdKey(t)], st = r ? stats(r) : null; means[t] = st ? (st.anyOver ? '>' + st.max : +fmt(st.mean,1)) : ''; });
  const payload = {
    name: S.student.name.trim(), cls: S.student.cls.trim(),
    hyp: d.pick('hyp'), iv: d.pick('iv'), dv: d.pick('dv'), cvs: d.cvs.join('；'),
    calAvg: d.calAvg === null ? '' : +fmt(d.calAvg,1), means,
    allResults: d.rows.map(r => `${r.tube} [${r.cond}] 各次: ${r.trials.join(', ')} 平均: ${r.mean}`).join('\n'),
    mcqOk: Q4.filter(q => S.s4.ans[q.id] !== undefined && q.opts[S.s4.ans[q.id]].ok).length + '/' + Q4.length,
    concl: T.concl, e1e2: T.e1e2, limits: T.limits, improve: T.improve
  };
  msg.textContent = L('提交中…','Submitting…');
  try {
    await fetch(CONFIG.SUBMIT_URL, { method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(payload) });
    msg.textContent = L('已提交給老師（' + new Date().toLocaleTimeString() + '）。','Submitted (' + new Date().toLocaleTimeString() + ').');
  } catch(e){
    msg.textContent = L('提交失敗，請檢查網絡，或用「複製文字」交給老師。','Submit failed. Check your connection or use “Copy text”.');
  }
}
function printReport(){ buildReport(); document.body.classList.add('print-report'); window.print(); setTimeout(() => document.body.classList.remove('print-report'), 500); }

/* ==========================================================================
⑫ 啟動
========================================================================== */
renderAll();
</script>
